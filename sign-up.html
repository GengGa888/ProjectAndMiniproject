<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก - ระบบสืบค้นโปรเจกต์และมินิโปรเจกต์</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #29b6f6 0%, #b3e5fc 50%, #e1f5fe 100%);
      padding: 40px 0;
    }

    .register-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      padding: 0 20px;
      margin-top: 40px;
    }

    .logo-container {
      position: absolute;
      top: -55px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .logo-container img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
    }

    .register-card {
      background: #ffffff;
      border-radius: 6px;
      padding: 70px 35px 35px 35px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .register-card h2 {
      font-size: 1.25rem;
      color: #2b2b2b;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #333333;
      margin-bottom: 5px;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input, 
    .input-wrapper select {
      width: 100%;
      padding: 9px 35px 9px 12px;
      font-size: 0.9rem;
      border: 1px solid #bce0fd;
      background-color: #f0f7ff;
      border-radius: 5px;
      outline: none;
      transition: all 0.2s ease;
      color: #333;
      appearance: none; /* ซ่อนลูกศรเดิมของ select */
    }

    .input-wrapper input:focus,
    .input-wrapper select:focus {
      border-color: #29b6f6;
      box-shadow: 0 0 5px rgba(41, 182, 246, 0.5);
    }

    .input-wrapper i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #888888;
      font-size: 0.85rem;
      pointer-events: none;
    }

    .btn-submit {
      width: 100%;
      padding: 11px;
      background: linear-gradient(to bottom, #34b3c7, #258ca3);
      border: none;
      border-radius: 5px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: opacity 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
    }

    .footer-links a {
      color: #0088cc;
      text-decoration: none;
      font-weight: 500;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="register-wrapper">
    <div class="logo-container">
      <img src="https://academic.dusit.ac.th/academic/edu/util/img/login/sdu-newlogo.png" alt="ตราสัญลักษณ์">
    </div>

    <div class="register-card">
      <h2>ลงทะเบียนใช้งานระบบ</h2>
    
        <!-- รหัสนักศึกษา / บุคลากร -->
        <div class="form-group">
          <label for="student_id">รหัสนักศึกษา / รหัสบุคลากร</label>
          <div class="input-wrapper">
            <input type="text" id="student_id" name="student_id" placeholder="กรอกรหัสประจำตัว" required>
            <i class="fa-solid fa-user"></i>
          </div>
        </div>

        <!-- อีเมล -->
        <div class="form-group">
          <label for="email">อีเมลสถาบัน</label>
          <div class="input-wrapper">
            <input type="email" id="email" name="email" placeholder="example@mail.com" required>
            <i class="fa-solid fa-envelope"></i>
          </div>
        </div>

        <!-- สาขาวิชา / คณะ -->
        <div class="form-group">
          <label for="department">สาขาวิชา / คณะ</label>
          <div class="input-wrapper">
            <select id="department" name="department" required>
              <option value="" disabled selected>-- เลือกสาขาวิชา --</option>
              <option value="it">เทคโนโลยีสารสนเทศ</option>
              <option value="cs">วิทยาการคอมพิวเตอร์</option>
              <option value="se">วิศวกรรมซอฟต์แวร์</option>
              <option value="other">สาขาอื่นๆ</option>
              <option value="other">ไม่ใช่บุลคลในมหาวิทยาลัย</option>
            </select>
            <i class="fa-solid fa-chevron-down"></i>
          </div>
        </div>

        <!-- รหัสผ่าน -->
        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="กำหนดรหัสผ่าน" required>
            <i class="fa-solid fa-lock"></i>
          </div>
        </div>

        <!-- ยืนยันรหัสผ่าน -->
        <div class="form-group">
          <label for="confirm_password">ยืนยันรหัสผ่าน</label>
          <div class="input-wrapper">
            <input type="password" id="confirm_password" name="confirm_password" placeholder="กรอกรหัสผ่านอีกครั้ง" required>
            <i class="fa-solid fa-shield-halved"></i>
          </div>
        </div>

        <button type="submit" class="btn-submit">ยืนยันการสมัครสมาชิก</button>
      </form>

      <div class="footer-links">
        มีบัญชีผู้ใช้งานอยู่แล้ว? <a href="login.html">เข้าสู่ระบบที่นี่</a>
      </div>
    </div>
  </div>

</body>
</html>

</head>

</html>
