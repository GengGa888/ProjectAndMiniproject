<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบสืบค้นโปรเจกต์และมินิโปรเจกต์</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Sarabun', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* พื้นหลังไล่เฉดสีฟ้าแบบในตัวอย่าง */
      background: linear-gradient(135deg, #29b6f6 0%, #b3e5fc 50%, #e1f5fe 100%);
    }

    .login-wrapper {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 0 20px;
      margin-top: 50px;
    }

    .logo-container {
      position: absolute;
      top: -65px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .logo-container img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      filter: drop-shadow(0px 4px 6px rgba(0, 0, 0, 0.15));
    }

    .login-card {
      background: #ffffff;
      border-radius: 6px;
      padding: 85px 35px 35px 35px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    .login-card h2 {
      font-size: 1.25rem;
      color: #2b2b2b;
      font-weight: 600;
      margin-bottom: 25px;
      text-align: left;
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      color: #333333;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper input {
      width: 100%;
      padding: 10px 35px 10px 12px;
      font-size: 0.95rem;
      border: 1px solid #bce0fd;
      background-color: #f0f7ff;
      border-radius: 5px;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-wrapper input:focus {
      border-color: #29b6f6;
      box-shadow: 0 0 5px rgba(41, 182, 246, 0.5);
    }

    .input-wrapper i {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #888888;
      font-size: 0.9rem;
    }

    .btn-submit {
      width: 100%;
      padding: 11px;
      background: linear-gradient(to bottom, #34b3c7, #258ca3);
      border: none;
      border-radius: 5px;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s ease;
    }

    .btn-submit:hover {
      opacity: 0.9;
    }

    .footer-links {
      margin-top: 25px;
      font-size: 0.85rem;
    }

    .footer-links a {
      color: #0095ff;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .divider {
      height: 1px;
      background-color: #e6e6e6;
      margin: 15px 0;
    }

    .user-count {
      color: #333333;
      font-size: 0.85rem;
    }

    .user-count span {
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="logo-container">
      <img src="https://academic.dusit.ac.th/academic/edu/util/img/login/sdu-newlogo.png" alt="ตราสัญลักษณ์">
    </div>

    <div class="login-card">
  <h2 style="text-align: center;">เข้าสู่ระบบ</h2>
      
      <form action="#" method="POST">
        <div class="form-group">
          <label for="username">ชื่อผู้ใช้งาน</label>
          <div class="input-wrapper">
            <input type="text" id="username" name="username" placeholder="user" required>
            <i class="fa-solid fa-user"></i>
          </div>
        </div>

        <div class="form-group">
          <label for="password">รหัสผ่าน</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <i class="fa-solid fa-lock"></i>
          </div>
        </div>

        <button type="submit" class="btn-submit">ลงชื่อเข้าใช้</button>
      </form>

      <div class="footer-links">
        <a href="#">สมัครสมาชิก</a>
        <div class="divider"></div>
        <div class="user-count">
          จำนวนผู้ใช้งานระบบปัจจุบัน <span>0</span> คน
        </div>
      </div>
    </div>
  </div>

</body>
</html>

</head>

</html>
